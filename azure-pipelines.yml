trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: VariablesExplit
  - name: imageName
    value: 'explit'
  - name: imageTag
    value: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Build Docker Image
    jobs:
      - job: BuildImage
        displayName: Build and Compress Docker Image
        steps:
          - checkout: self

          # Display build info
          - script: |
              echo "Build ID: $(Build.BuildId)"
              echo "Repository: $(Build.Repository.Name)"
              echo "Branch: $(Build.SourceBranch)"
              echo "Image Name: $(imageName):$(imageTag)"
            displayName: 'Display Build Info'

          # Display environment variables for debugging
          - script: |
              echo "Firebase Config Check:"
              echo "PROJECT_ID: $(NEXT_PUBLIC_FIREBASE_PROJECT_ID)"
              echo "API_KEY: $(NEXT_PUBLIC_FIREBASE_API_KEY)"
              echo "AUTH_DOMAIN: $(NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN)"
            displayName: 'Verify Environment Variables'

          # Build Docker image with secrets from Variable Group
          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              command: 'build'
              repository: $(imageName)
              tags: |
                $(imageTag)
              arguments: |
                --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=$(NEXT_PUBLIC_FIREBASE_API_KEY)
                --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$(NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN)
                --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=$(NEXT_PUBLIC_FIREBASE_PROJECT_ID)
                --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$(NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET)
                --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$(NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID)
                --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=$(NEXT_PUBLIC_FIREBASE_APP_ID)
                --build-arg NEXT_PUBLIC_FIREBASE_DATABASE_NAME=$(NEXT_PUBLIC_FIREBASE_DATABASE_NAME)
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                docker image save -o $(Build.SourcesDirectory)/image.tar $(imageName):$(imageTag)
          - task: CopyFiles@2
            displayName: 'Copy Files images'
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)'
              Contents: 'image.tar'
              TargetFolder: '$(Build.ArtifactStagingDirectory)'
              CleanTargetFolder: true
              preserveTimestamp: true
          - script: |
              sed -i "s/latest/$(imageTag)/" ./k8s/definition.yaml
            displayName: 'Set version in Kubernetes definition'
          - script: |
              sed -i "s/imageName/$(imageName)/" ./k8s/definition.yaml
            displayName: 'Set image name in Kubernetes definition'
          - task: CopyFiles@2
            displayName: 'Copy Files kubernetes definition'
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)/k8s'
              Contents: '*'
              TargetFolder: '$(Build.ArtifactStagingDirectory)'
              CleanTargetFolder: false
              preserveTimestamp: true
          - script: |
              echo $(imageName):$(imageTag) > $(Build.ArtifactStagingDirectory)/tag.txt
            displayName: 'Save tag to get in release pipeline'
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: image-$(imageName)
