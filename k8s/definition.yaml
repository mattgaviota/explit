apiVersion: apps/v1
kind: Deployment
metadata:
  name: imageName
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imageName
  template:
    metadata:
      labels:
        app: imageName
    spec:
      containers:
        - name: imageName
          image: nuntius.azurecr.io/imageName:latest
          resources:
            limits:
              memory: 200Mi
            requests:
              memory: 20Mi
          envFrom:
            - secretRef:
                name: secrets
            - configMapRef:
                name: cluster-map
      imagePullSecrets:
        - name: nuntiusregistry
---
apiVersion: v1
kind: Service
metadata:
  name: imageName-service
spec:
  type: ClusterIP
  selector:
    app: imageName
  ports:
    - port: 3000
      targetPort: 3000
---
# Ingress service configuration
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress-imageName
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_pass_header accept;
      proxy_pass_header origin;
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Content-Security-Policy: frame-ancestors 'none'";
spec:
  ingressClassName: ingress-nginx
  rules:
    - host: imageName.nuntius.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: imageName-service
                port:
                  number: 3000
