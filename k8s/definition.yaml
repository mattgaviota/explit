apiVersion: apps/v1
kind: Deployment
metadata:
  name: imageName
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imageName
  template:
    metadata:
      labels:
        app: imageName
    spec:
      containers:
        - name: imageName
          image: nuntius.azurecr.io/imageName:latest
          resources:
            limits:
              memory: 200Mi
            requests:
              memory: 20Mi
          envFrom:
            - secretRef:
                name: secrets
            - configMapRef:
                name: cluster-map
      imagePullSecrets:
        - name: nuntiusregistry
---
apiVersion: v1
kind: Service
metadata:
  name: imageName-service
spec:
  type: ClusterIP
  selector:
    app: imageName
  ports:
    - port: 8080
      targetPort: 8080